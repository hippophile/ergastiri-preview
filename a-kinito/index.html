<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A · Αυτό που ζητήσατε · κινητό</title>
<style>
html,body{margin:0;height:100%;background:#E9E3D9;font-family:system-ui,sans-serif;color:#171515}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;box-sizing:border-box}

</style></head><body>
<div class="wrap">
<h1>A · Αυτό που ζητήσατε · όπως φαίνεται σε κινητό</h1>
<div class="phone"><iframe src="../a/" title="A · Αυτό που ζητήσατε"></iframe></div>
<p>Σε κινητό ανοίξτε απευθείας: <a href="../a/">την κανονική σελίδα</a></p>
</div>
