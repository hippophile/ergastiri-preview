<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Εργαστήρι Τέχνης · A</title></head><body style="margin:0">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;1,400&family=GFS+Didot&display=swap">
<style>
/* Layout: the school's current page (dark menu, colour photos, cream timetable) rebuilt as a standalone page. Single committed look. */
:root{
  --ink:#171515; --ink2:#0D0C0B; --paper:#FFFFFF; --cream:#F6F2EC; --line:#E4DDD2;
  --muted:#5E574E; --body:#3F3A37; --orange:#E0662F; --deep:#B4471A; --peach:#F2B48F; --warm:#F0EBE3;
  --sans:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"EB Garamond",Georgia,"Times New Roman",serif;
  --gut:max(24px,env(safe-area-inset-left,0px)); --gutr:max(24px,env(safe-area-inset-right,0px));
  --hdr:68px;
}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:var(--deep)}a:hover{color:#8A3412}
button{font:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
::selection{background:var(--orange);color:#fff}
.wrap{max-width:1360px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr);box-sizing:border-box}
.serif{font-family:var(--serif)}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);border-bottom:1px solid rgba(255,255,255,.08);color:#fff}
.hin{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px}
.logo{color:#fff;text-decoration:none;display:flex;flex-direction:column;line-height:1.1;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.logo:hover{color:#fff}
.l1{font-size:22px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.l2{font-size:12px;font-weight:600;letter-spacing:.22em;color:#D9D2C8}
.desknav{display:flex;align-items:center;gap:4px 22px}
.navlink{position:relative;color:#fff;text-decoration:none;font-size:17px;font-weight:700;padding:14px 4px;background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.navlink::after{content:'';position:absolute;left:4px;right:4px;bottom:8px;height:2px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.navlink:hover,.navlink:focus-visible{color:#fff}
.navlink:hover::after,.navlink:focus-visible::after{transform:scaleX(1)}
.dd{position:relative}
.ddpanel{position:absolute;top:100%;left:-16px;min-width:270px;background:var(--ink);border-top:3px solid var(--orange);box-shadow:0 18px 40px rgba(0,0,0,.35);padding:8px 0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s,transform .2s,visibility 0s .2s}
.dd:hover .ddpanel,.dd:focus-within .ddpanel{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .2s}
.chev{transition:transform .2s}
.dd:hover .chev,.dd:focus-within .chev{transform:rotate(180deg)}
.ddlink{display:block;color:#fff;text-decoration:none;padding:12px 20px;font-size:17px;font-weight:600}
.ddlink:hover,.ddlink:focus-visible{background:rgba(255,255,255,.08);color:var(--peach)}
.ctabtn{background:var(--orange);color:var(--ink);text-decoration:none;font-size:16px;font-weight:800;padding:13px 18px;transition:background .2s;white-space:nowrap;display:inline-block;border:0;cursor:pointer}
.ctabtn:hover{background:#F2874F;color:var(--ink)}
.ctabtn.big{font-size:17px;padding:15px 22px}
.burger{display:none;width:48px;height:48px;background:var(--orange);border:0;cursor:pointer;align-items:center;justify-content:center}
.mobnav{display:none;flex-direction:column;padding-bottom:20px}
.mobnav a{color:#fff;text-decoration:none;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:19px;font-weight:700}
@media (max-width:1300px){.desknav,.deskcta{display:none !important}.burger{display:inline-flex}.mobnav.open{display:flex}}

/* heroes */
.hero{position:relative;height:calc(100svh - var(--hdr) - env(safe-area-inset-top,0px));min-height:600px;max-height:1050px;overflow:hidden;background:var(--ink);color:#fff}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.slide img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02);transition:transform 7s ease-out}
.slide.on{opacity:1}
.slide.on img{transform:scale(1.12)}
.hgrad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,12,11,.45) 0%,rgba(14,12,11,.12) 32%,rgba(14,12,11,.35) 60%,rgba(14,12,11,.88) 100%)}
.hin1{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
.hin1 .wrap{width:100%;padding-bottom:40px;display:flex;flex-direction:column;gap:20px}
.h1c{margin:0;font-size:clamp(56px,8vw,104px);font-weight:800;line-height:.9;letter-spacing:-.035em}
.h1c em{font-family:var(--serif);font-weight:400;font-style:italic;letter-spacing:-.01em;font-size:1.15em;color:var(--peach)}
.hsub{margin:0;font-size:clamp(17px,1.6vw,21px);line-height:1.5;max-width:560px;color:var(--warm)}
.hbtns{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.ghostbtn{color:#fff;text-decoration:none;font-size:17px;font-weight:800;padding:14px 20px;border:1px solid rgba(255,255,255,.55);background:none;cursor:pointer;transition:background .2s,color .2s}
.ghostbtn:hover{background:#fff;color:var(--ink)}
.hcap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:20px;border-top:1px solid rgba(255,255,255,.3)}
.hcap .t{font-size:16px;color:#D9D2C8}
.hcap em{font-family:var(--serif);font-size:19px;color:#fff}
.dots{display:flex;align-items:center}
.dotbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;padding:0}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid #fff;display:block}
.dot.on{background:#fff}
.mhin{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,9,8,.55) 0%,rgba(10,9,8,.34) 45%,rgba(10,9,8,.2) 62%,rgba(10,9,8,.68) 100%)}
.mhin .wrap{height:100%;padding-top:5vh;padding-bottom:44px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.mword{margin:0;font-weight:800;line-height:.88;letter-spacing:-.04em;font-size:clamp(64px,14vw,210px)}
.mw1{display:block;animation:mtrack 2s ease both}
.mw2{display:block;font-family:var(--serif);font-weight:400;font-style:italic;color:var(--cream);font-size:.9em;letter-spacing:-.01em;margin:-.02em 0 0 30%;text-shadow:0 0 40px rgba(10,9,8,.45);animation:mup 1.6s ease .9s both}
@keyframes mtrack{from{opacity:0;letter-spacing:.3em}to{opacity:1;letter-spacing:-.04em}}
@keyframes mup{from{opacity:0;transform:translateY(40%)}to{opacity:1;transform:none}}
.mmeta{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 48px}
@media (max-width:760px){.mw2{margin-left:18%}}
/* Αρχική 3: split, name on dark, painting untouched */
.hero.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.sptext{display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding:clamp(40px,8vh,96px) clamp(24px,3.5vw,56px) 28px max(var(--gut),calc((100vw - 1360px) / 2 + var(--gut)))}
.spin{display:flex;flex-direction:column;gap:20px}
.spword{margin:0;font-family:'GFS Didot',var(--serif);font-weight:400;font-size:clamp(52px,6vw,104px);line-height:.98;letter-spacing:-.02em}
.spsub{margin:0;font-size:19px;font-weight:700;line-height:1.45}
.spdesc{margin:0;font-size:19px;line-height:1.6;color:var(--warm);max-width:440px}
.sppic{position:relative;overflow:hidden;background:#0f0e0d}
.sslide img{transform:none !important;transition:none}
.spcap{border-top-color:rgba(255,255,255,.18)}
@media (max-width:760px){.hero.split{grid-template-columns:minmax(0,1fr);height:auto;min-height:0;max-height:none}.sptext{padding:40px var(--gutr) 24px var(--gut)}.sppic{aspect-ratio:4/5}}

/* strips */
.soc{color:var(--warm);text-decoration:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;transition:color .2s,transform .2s}
.soc svg{width:24px;height:24px}
.soc:hover{color:var(--peach);transform:translateY(-2px)}
.facts{background:var(--ink2);color:#fff;border-top:1px solid rgba(255,255,255,.08)}
.factgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.fact{padding:26px 24px 28px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.fact+.fact{border-left:1px solid rgba(255,255,255,.12);padding-left:24px}
.fn{font-family:var(--serif);font-size:42px;line-height:1;color:var(--peach)}
.fl{font-size:16px;line-height:1.5;color:#CFC7BB}
@media (max-width:900px){.factgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.fact:nth-child(3){border-left:0;padding-left:0}.fact:nth-child(n+3){border-top:1px solid rgba(255,255,255,.12)}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px;background:var(--ink)}
.tile{position:relative;display:block;overflow:hidden;aspect-ratio:1/1;color:#fff;text-decoration:none;background:#2A2624;border:0;padding:0;cursor:pointer;text-align:left;max-width:100%}
.tile.wide{grid-column:span 2;aspect-ratio:auto}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.tile:hover img{transform:scale(1.05)}
.tile:hover,.tile:focus-visible{color:#fff}
.tile:focus-visible{outline:3px solid var(--orange);outline-offset:-3px}
.tshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,12,11,.72) 0%,rgba(14,12,11,.35) 22%,rgba(14,12,11,0) 42%)}
.ttext{position:absolute;top:22px;left:22px;right:22px;display:flex;flex-direction:column;gap:6px}
.tname{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.15;text-shadow:0 1px 10px rgba(0,0,0,.45)}
.tmore{font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.tmore span{transition:transform .2s}
.tile:hover .tmore span{transform:translateX(4px)}
.tcredit{position:absolute;right:14px;bottom:10px;font-family:var(--serif);font-style:italic;font-size:16px;color:#fff;text-shadow:1px 1px 3px #000}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile.wide{aspect-ratio:2/1}}
@media (max-width:520px){.tiles{grid-template-columns:minmax(0,1fr)}.tile,.tile.wide{grid-column:auto;aspect-ratio:4/3}}

/* timetable */
.prog{background:var(--cream);color:var(--ink);scroll-margin-top:calc(var(--hdr) + 8px)}
.prog .wrap{padding-block:44px 48px;display:flex;flex-direction:column;gap:24px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
@media (min-width:1000px){.days{grid-template-columns:1fr 1fr 1.3fr}}
.daycol{padding:24px 26px 26px;display:flex;flex-direction:column;gap:16px;min-width:0;border:1px solid #D6CBBB;border-radius:16px;transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s ease,background-color .3s ease,box-shadow .3s ease}
.daycol:hover{transform:translateY(-4px);border-color:var(--deep);background:#FBF8F3;box-shadow:0 16px 30px -22px rgba(23,21,21,.45)}
.nw{white-space:nowrap}
@media (prefers-reduced-motion:reduce){.daycol:hover{transform:none}}
.dlbl{font-size:15px;font-weight:800;letter-spacing:.16em;color:var(--deep)}
.slot{display:flex;flex-direction:column;gap:3px}
.slot b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.slot span{font-size:16px;line-height:1.5;color:var(--body)}

/* bands */
.band{position:relative;overflow:hidden;background:var(--ink);min-height:720px;scroll-margin-top:var(--hdr)}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,12,11,.93) 0%,rgba(14,12,11,.8) 40%,rgba(14,12,11,.28) 74%,rgba(14,12,11,.12) 100%)}
.band.rev .scrim{background:linear-gradient(270deg,rgba(14,12,11,.93) 0%,rgba(14,12,11,.8) 40%,rgba(14,12,11,.28) 74%,rgba(14,12,11,.12) 100%)}
.bandin{position:relative;padding-block:128px;display:flex;color:#fff}
.band.rev .bandin{justify-content:flex-end}
.col{width:100%;max-width:640px;display:flex;flex-direction:column;gap:22px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:800;letter-spacing:.2em;color:var(--peach)}
.eyebrow i{width:40px;height:1px;background:currentColor;display:block}
.tfacts{margin:0;font-size:19px;font-weight:700;line-height:1.4;color:var(--warm)}
.bh2{margin:0;font-size:clamp(34px,4vw,54px);font-weight:800;letter-spacing:-.025em;line-height:1.04;text-wrap:balance}
.lead{margin:0;font-size:20px;line-height:1.8;color:#EEE8DF}
.count{position:absolute;right:var(--gutr);bottom:22px;font-size:13px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.75)}
.band.rev .count,.fband.rev .count{right:auto;left:var(--gut)}
.band.plain{background:var(--cream);min-height:0}
.band.plain .scrim,.band.plain .count{display:none}
.band.plain .bandin{justify-content:flex-start;color:var(--ink);padding-block:112px}
.band.plain .col{max-width:760px}
.band.plain .eyebrow{color:var(--deep)}
.band.plain .lead{color:var(--body)}
.band.plain .morehint{color:var(--muted)}
.morebtn{background:var(--orange);color:var(--ink);border:0;cursor:pointer;padding:15px 24px;font-size:17px;font-weight:800;display:inline-flex;align-items:center;gap:10px;transition:background .2s}
.morebtn:hover{background:#F2874F}
.morebtn span{transition:transform .2s}
.morebtn:hover span{transform:translateX(4px)}
.morehint{font-size:16px;color:rgba(255,255,255,.72);align-self:center}
.fband{position:relative;overflow:hidden;background:var(--ink);min-height:800px;scroll-margin-top:var(--hdr)}
.fscrim{position:absolute;inset:0;background:rgba(14,12,11,.22)}
.fin{position:relative;padding-block:112px;display:flex}
.fband.rev .fin{justify-content:flex-end}
.fpanel{width:100%;max-width:620px;box-sizing:border-box;background:rgba(17,15,14,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;padding:44px 44px 40px;display:flex;flex-direction:column;gap:20px;min-width:0}
.fpanel .lead{font-size:19px}
@media (max-width:760px){.band,.fband{min-height:0}.scrim,.band.rev .scrim{background:rgba(14,12,11,.8)}.bandin,.fin{padding-block:72px}.fpanel{padding:28px 22px}.count{display:none}}
.more summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:12px 0;font-size:17px;font-weight:800;color:var(--peach)}
.more summary::-webkit-details-marker{display:none}
.more summary .chev{transition:transform .25s ease}
.more[open] summary .chev{transform:rotate(180deg)}
.more .lbl-less{display:none}
.more[open] .lbl-more{display:none}
.more[open] .lbl-less{display:inline}
.more .body{display:flex;flex-direction:column;gap:16px;padding-top:6px;animation:open .35s ease both}
.band.plain .more summary{color:var(--deep)}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* detail page */
.pagefade{animation:pf .45s ease both}
@keyframes pf{from{opacity:0}to{opacity:1}}
.dhero{position:relative;overflow:hidden;background:var(--ink);color:#fff;min-height:540px;display:flex;align-items:flex-end}
.dhero.plain{background:var(--cream);color:var(--ink);min-height:400px}
.dscrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,12,11,.4) 0%,rgba(14,12,11,.2) 40%,rgba(14,12,11,.88) 100%)}
.dhero.plain .dscrim{display:none}
.dheroin{position:relative;width:100%;padding-block:64px 52px;display:flex;flex-direction:column;gap:18px}
.dhero.plain .eyebrow{color:var(--deep)}
.back{align-self:flex-start;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:inherit;padding:10px 16px;cursor:pointer;font-size:16px;font-weight:700}
.dhero.plain .back{background:#fff;border-color:#D9D2C8}
.dh1{margin:0;font-size:clamp(40px,5.4vw,72px);font-weight:800;letter-spacing:-.03em;line-height:1;max-width:1000px;text-wrap:balance}
.dbody{padding-block:80px 64px;display:flex;flex-wrap:wrap;gap:48px 80px;align-items:flex-start}
.dtext{flex:1.6 1 520px;min-width:0;display:flex;flex-direction:column;gap:22px;font-size:20px;line-height:1.85;color:#2E2A27}
.dtext p{margin:0}
.dtext .first{font-size:21px;line-height:1.6;font-weight:600;color:var(--ink)}
.aside{flex:1 1 300px;min-width:0;position:sticky;top:calc(var(--hdr) + 24px);display:flex;flex-direction:column;gap:16px}
.abox{background:var(--ink);color:#fff;border-top:3px solid var(--orange);padding:26px 28px;display:flex;flex-direction:column;gap:10px;font-size:18px;line-height:1.7}
.albl{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--orange)}
.xbox{background:var(--cream);padding:24px 26px;display:flex;flex-direction:column;gap:10px}
.xbox ul{margin:0;padding-left:18px;font-size:17px;line-height:1.9;color:var(--body)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px 12px}
.thumb{background:none;border:0;padding:0;cursor:zoom-in;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.thumb .im{overflow:hidden;display:block;background:#EFEAE2}
.thumb img{width:100%;height:260px;object-fit:cover;display:block;transition:transform .5s ease}
.thumb:hover img{transform:scale(1.04)}
.cap{font-family:var(--serif);font-style:italic;font-size:17px;color:#7A726A;line-height:1.35}
.note{margin:20px 0 0;padding:16px;border:1px dashed #B9B1A4;font-size:16px;color:var(--muted)}
.chip{background:#fff;border:1px solid #D9D2C8;cursor:pointer;padding:14px 20px;font-size:17px;font-weight:700;color:var(--ink);transition:border-color .2s}
.chip:hover{border-color:var(--orange)}

/* contact, footer */
.contact{background:var(--ink);color:#fff;scroll-margin-top:var(--hdr)}
.cin{padding-block:96px;display:flex;flex-wrap:wrap;gap:48px}
.cin > div{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:18px}
.ch2{margin:0;font-size:clamp(40px,4.4vw,56px);font-weight:800;letter-spacing:-.02em}
.phones{margin:0;font-size:20px;line-height:1.9;font-weight:700}
.phones a,.msg{color:var(--peach)}
.msgrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:17px;color:#BDB6AC}
.msg{font-weight:800;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.msg:hover{color:#fff}
.foot{background:var(--ink2);color:#9C958B}
.foot .wrap{padding-block:28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;font-size:15px}
.foot a{color:#9C958B}
/* free-lesson strip */
.promo{background:var(--orange);color:var(--ink)}
.promo .wrap{padding-block:10px;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 10px;font-size:17px;font-weight:600;text-align:center}
.promo b{font-weight:800}
.promo a{color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.progx{margin:0;font-size:17px;color:var(--body)}
@media (max-width:760px){.onlyd{display:none !important}.dots{display:none}}
.foot .ctrl{flex-basis:100%;margin:0}
/* round-2 fixes */
.tline{font-size:17px;font-weight:600;line-height:1.35;max-width:30ch;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.spwho{margin:0;font-size:19px;font-weight:700;line-height:1.45}
.cfree{margin:0;font-size:20px;line-height:1.5;color:#fff}
.count{display:none !important}
@media (max-width:760px){.sppic{order:-1;aspect-ratio:3/2}}


/* option switcher: small floating pill, not a bar */

          'Από την ίδρυσή του το 1993 έως σήμερα, το Εργαστήρι Τέχνης έχει να επιδείξει σχεδόν καθολικά ποσοστά επιτυχίας των μαθητών του για την εισαγωγή συνήθως σε σχολές πρώτης επιλογής τους. Καθοριστική σημασία διαδραματίζουν οι υψηλοί βαθμοί των ειδικών μαθημάτων Ελευθέρου και Γραμμικού Σχεδίου, οι οποίοι πολλές φορές κάνουν τη διαφορά έναντι ακόμη και χαμηλότερων βαθμών στα λοιπά μαθήματα εξέτασης.',
          'Επειδή τα παιδιά στη Γ΄ Λυκείου έχουν ιδιαίτερα φορτωμένο πρόγραμμα, είναι προτιμότερο να ξεκινήσουν τα μαθήματα σχεδίου από τη Β΄ Λυκείου, ώστε να μπορέσουν να καλύψουν με σχετική άνεση και να αφομοιώσουν καλύτερα την ύλη που απαιτείται. Όμως, ακόμη κι αν κάποιος μαθητής ξεκινήσει μαθήματα σχεδίου στη Γ΄ Λυκείου, με μία μεθοδευμένη προσπάθεια του ιδίου και του διδακτικού προσωπικού, μπορεί να καλύψει την ύλη και να φθάσει σε επαρκές για τις εξετάσεις επίπεδο. Το τελικό αποτέλεσμα εξαρτάται και από το γενικότερο πρόγραμμα κάθε υποψηφίου και την προσπάθεια που πρέπει να καταβάλλει για τα λοιπά μαθήματα εξέτασης. Ορισμένοι μαθητές επιλέγουν να ξεκινήσουν την προετοιμασία ιδίως στο Ελεύθερο Σχέδιο από την Α’ Λυκείου, προκειμένου να αφομοιώσουν με άνεση τη σχετική ύλη αλλά και να καλλιεργήσουν τις δεξιότητές τους.',

      '<section class="wrap" style="padding-bottom:96px"><div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:28px"><h2 style="margin:0;font-size:40px;font-weight:800;letter-spacing:-.02em">Φωτογραφίες</h2><span style="font-size:17px;color:#7A726A">' + (p.pics.length ? p.pics.length + (p.pics.length === 1 ? ' φωτογραφία' : ' φωτογραφίες') + ' · πατήστε για μεγέθυνση' : '') + '</span></div>' +
      (p.pics.length ? '<div class="grid">' + pics.map(function (g, j) { return '<button type="button" class="thumb" data-lb="' + j + '" aria-label="Μεγέθυνση: ' + esc(g.cap) + ' ' + (j + 1) + '"><span class="im"><img src="' + esc(g.src) + '" alt="' + esc(g.cap) + '" loading="lazy" decoding="async"></span><span class="cap">' + esc(g.cap) + '</span></button>'; }).join('') + '</div>' : '') +

      '<section style="background:var(--cream)"><div class="wrap" style="padding-block:56px;display:flex;flex-direction:column;gap:18px"><span class="albl" style="color:var(--deep)">ΔΕΙΤΕ ΚΑΙ</span><div style="display:flex;flex-wrap:wrap;gap:10px">' +
      sections.filter(function (o) { return o.id !== c.id; }).map(function (o) { return '<button type="button" class="chip" data-page="' + o.id + '">' + esc(o.title) + ' →</button>'; }).join('') + '</div></div></section></div>';
  }
  function contact() {
    return '<section id="epikoinonia" class="contact" aria-label="Επικοινωνία"><div class="wrap cin"><div class="rv">' +
      '<h2 class="ch2">Επικοινωνία</h2><p class="cfree"><b>Δωρεάν δοκιμαστικό μάθημα</b> σε όλα τα τμήματα. Καλέστε για να κλείσετε θέση.</p><p style="margin:0;font-size:19px;line-height:1.7;color:var(--warm)">Κοιμήσεως Θεοτόκου 38-40, εμπορικό κέντρο ΕΛΤΑ<br>Άγιος Στέφανος Αττικής, ΤΚ 14565</p>' +
      '<p class="phones"><a href="tel:+302106216687">210 621 6687</a><br><a href="' + TEL + '">694 726 5957</a><br><a href="mailto:nadia.adamopoulou68@gmail.com">nadia.adamopoulou68@gmail.com</a></p>' +
      '<div class="msgrow"><span>Μήνυμα στο 694 726 5957:</span><a class="msg" href="' + VIBER + '">Viber</a><a class="msg" href="' + WA + '">WhatsApp</a></div>' +
      '<a href="https://www.google.com/maps/search/?api=1&amp;query=%CE%9A%CE%BF%CE%B9%CE%BC%CE%AE%CF%83%CE%B5%CF%89%CF%82+%CE%98%CE%B5%CE%BF%CF%84%CF%8C%CE%BA%CE%BF%CF%85+38+%CE%86%CE%B3%CE%B9%CE%BF%CF%82+%CE%A3%CF%84%CE%AD%CF%86%CE%B1%CE%BD%CE%BF%CF%82" target="_blank" rel="noopener" style="color:#fff;font-weight:700">Άνοιγμα στο Google Maps ↗</a></div>' +
      '<div class="rv" style="flex:1 1 520px"><img src="' + B + 'b3d4edf787024794af754c45ec0e82fa.jpg" alt="Η βιτρίνα του Εργαστηρίου" loading="lazy" style="width:100%;height:340px;object-fit:cover;display:block"><span class="cap" style="color:#9C958B">Η βιτρίνα του Εργαστηρίου</span></div></div></section>' +
      '<section id="syndesmoi" class="wrap" style="padding-block:64px;display:flex;flex-wrap:wrap;align-items:baseline;gap:16px 48px"><h2 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em">Σύνδεσμοι</h2><p style="margin:0;font-size:17px;color:var(--muted)">[θα προστεθούν]</p></section>' +
      '<footer class="foot"><div class="wrap"><span>© Εργαστήρι Τέχνης · Άγιος Στέφανος</span><div style="display:flex;flex-wrap:wrap;gap:8px 20px"><a href="#top">Όροι χρήσεως ιστοτόπου</a><a href="#top">Δήλωση προστασίας προσωπικών δεδομένων</a><a href="#top">Δήλωση αποποίησης ευθύνης</a><a href="#top">Όροι χρήσης cookies</a></div><p class="ctrl">Υπεύθυνη επεξεργασίας: Κωνσταντία Αδαμοπούλου, nadia.adamopoulou68@gmail.com</p></div></footer>';
  }
  function switcher() { return '';
    if (!state.sw) return '<button type="button" class="swopen" data-act="swshow">ΕΠΙΛΟΓΕΣ</button>';
    var g = function (label, key, opts, title) {
      return '<div class="g" role="group" aria-label="' + label + '"><span class="gl">' + label + '</span>' + opts.map(function (k) {
        return '<button type="button" class="vbtn' + (state[key] === k ? ' on' : '') + '" data-opt="' + key + ':' + k + '" aria-pressed="' + (state[key] === k) + '" title="' + esc(title[k]) + '">' + k + '</button>';
      }).join('') + '</div>';
    };
    return '<div class="sw" role="region" aria-label="Επιλογές προς σύγκριση">' +
      g('Αρχική', 'hero', ['1', '2', '3'], { '1': 'Αρχική 1: φωτογραφίες σε χρώμα, τίτλος κάτω αριστερά', '2': 'Αρχική 2: σαν το merso, τεράστιο όνομα (χωρίς το δέντρο)', '3': 'Αρχική 3: όνομα αριστερά, πίνακας δεξιά χωρίς τίποτα πάνω του' }) +
      g('Τμήματα', 'layout', ['1', '2', '3'], { '1': 'Πλακάκια, κάθε πλακάκι ανοίγει τη σελίδα του', '2': 'Πλακάκια + μεγάλες ζώνες από κάτω', '3': 'Πλακάκια + όλο το κείμενο πάνω στις φωτογραφίες' }) +
      '<button type="button" class="swx" data-act="swhide" aria-label="Απόκρυψη επιλογών">×</button></div>';
  }
  function lightbox() {
    if (state.lb == null || !lbList.length) return '';
    var g = lbList[state.lb];
    return '<div class="lb" role="dialog" aria-modal="true" aria-label="' + esc(g.cap) + '"><button type="button" class="lbx" data-act="lbclose" aria-label="Κλείσιμο"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171515" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>' +
      (lbList.length > 1 ? '<button type="button" class="lbn lbp" data-act="lbprev" aria-label="Προηγούμενη">‹</button><button type="button" class="lbn lbnx" data-act="lbnext" aria-label="Επόμενη">›</button>' : '') +
      '<img src="' + esc(g.src) + '" alt="' + esc(g.cap) + '"><span class="cap">' + esc(g.cap) + ' · ' + (state.lb + 1) + ' / ' + lbList.length + '</span></div>';
  }
  function view() {
    var cur = sections.filter(function (c) { return c.id === state.page; })[0];
    var main = cur ? detail(cur) : hero() + programma() + strips() + tiles() + (state.layout === '2' ? bands() : '') + (state.layout === '3' ? fbands() : '');
    return header() + '<div class="promo" role="note"><div class="wrap"><span><b>1ο μάθημα δωρεάν</b> σε όλα τα τμήματα</span><span>· Κλείστε θέση: <a href="' + TEL + '">694 726 5957</a></span></div></div>' + '<main>' + main + '</main>' + contact() + switcher() + lightbox();
  }

  // ---- events ----
  function bind() {
    var app = document.getElementById('app');
    app.onclick = function (e) {
      var t = e.target.closest('[data-sec],[data-page],[data-act],[data-opt],[data-dot],[data-lb]');
      if (!t) return;
      if (t.dataset.sec) { e.preventDefault(); openSec(t.dataset.sec); }
      else if (t.dataset.page) { go(t.dataset.page); }
      else if (t.dataset.opt) {
        var kv = t.dataset.opt.split(':'); var patch = {}; patch[kv[0]] = kv[1]; patch.page = 'home'; patch.navOpen = false;
        store.set('et-' + kv[0], kv[1]); set(patch);
        if (kv[0] === 'layout') { var el = document.getElementById('tmimata'); if (el) el.scrollIntoView({ behavior: 'auto' }); } else window.scrollTo(0, 0);
      }
      else if (t.dataset.dot) { state.idx = state.idx - (state.idx % 10) + Number(t.dataset.dot); syncSlides(); }
      else if (t.dataset.lb) { openLb(window.__pics || [], Number(t.dataset.lb)); }
      else {
        var a = t.dataset.act;
        if (a === 'top') goAnchor('top');
        else if (a === 'home') go('home');
        else if (a === 'nav') set({ navOpen: !state.navOpen });
        else if (a === 'swhide') { store.set('et-sw', '0'); set({ sw: false }); }
        else if (a === 'swshow') { store.set('et-sw', '1'); set({ sw: true }); }
        else if (a === 'lbclose') set({ lb: null });
        else if (a === 'lbprev') set({ lb: (state.lb - 1 + lbList.length) % lbList.length });
        else if (a === 'lbnext') set({ lb: (state.lb + 1) % lbList.length });
      }
    };
  }
  document.addEventListener('keydown', function (e) {
    if (state.lb == null) return;
    if (e.key === 'Escape') set({ lb: null });
    else if (e.key === 'ArrowRight') set({ lb: (state.lb + 1) % lbList.length });
    else if (e.key === 'ArrowLeft') set({ lb: (state.lb - 1 + lbList.length) % lbList.length });
  });

  // ---- slideshows: toggle classes only, so open "read more" sections stay open ----
  function syncSlides() {
    var groups = {};
    document.querySelectorAll('[data-g]').forEach(function (el) { (groups[el.dataset.g] = groups[el.dataset.g] || []).push(el); });
    var k = 0;
    Object.keys(groups).forEach(function (g) {
      var els = groups[g], n = els.length, off = g === 'hero' || g === 'herodot' ? 0 : (k++);
      var cur = (state.idx + off) % n;
      els.forEach(function (el, j) { el.classList.toggle('on', j === cur); });
      var cnt = document.querySelector('[data-count="' + g + '"]');
      if (cnt) cnt.textContent = pad(cur + 1) + ' / ' + pad(n);
      if (g === 'hero') {
        var c = document.querySelector('[data-cap="hero"]'); var d = data.slideData[cur];
        if (c && d) c.innerHTML = '<em>' + esc(d[1]) + '</em> · ' + esc(d[2]);
        document.querySelectorAll('[data-dot]').forEach(function (b, j) { b.setAttribute('aria-current', j === cur ? 'true' : 'false'); });
      }
    });
  }
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (!reduce) setInterval(function () { state.idx = (state.idx + 1) % 1260; syncSlides(); }, 5000);

  render();
})();
